name: Tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Lint every PHP file
        run: find . \( -name '*.php' -o -name '*.phtml' \) -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Install PHPUnit
        run: curl -sSLO https://phar.phpunit.de/phpunit-10.phar

      - name: Run unit tests
        run: php phpunit-10.phar
