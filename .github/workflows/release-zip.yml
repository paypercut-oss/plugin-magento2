name: Release Magento Module ZIP

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version + artifact name
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"          # e.g. v1.1.0
          VERSION="${TAG#v}"                # 1.1.0
          NAME="paypercut-magento2-${VERSION}.zip"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip_name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Sync composer.json version to tag
        shell: bash
        run: |
          set -euo pipefail
          test -f composer.json
          python - <<'PY'
          import json
          from pathlib import Path
          import os

          version = os.environ["VERSION"]
          p = Path("composer.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          data["version"] = version
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY
        env:
          VERSION: ${{ steps.meta.outputs.version }}

      - name: Build ZIP (module root at ZIP root)
        shell: bash
        run: |
          set -euo pipefail
          
          MODULE_DIR="."
          ZIP="${{ steps.meta.outputs.zip_name }}"

          mkdir -p dist
          rm -f "dist/${ZIP}"

          # Create zip from inside the module directory so paths are correct (no top-level folder)
          pushd "${MODULE_DIR}" >/dev/null

          # Basic sanity checks
          test -f registration.php
          test -f composer.json
          test -f etc/module.xml

          # Build zip excluding typical junk
          zip -r "dist/${ZIP}" . \
            -x "*.git*" \
            -x "vendor/*" \
            -x "node_modules/*" \
            -x ".idea/*" \
            -x "internal/*" \
            -x ".vscode/*" \
            -x ".DS_Store" \
            -x "var/*" \
            -x "generated/*" \
            -x "pub/static/*" \
            -x "pub/media/*" \
            -x "auth.json" \
            -x "composer.lock"

          popd >/dev/null

      - name: Verify ZIP contents (top-level files exist)
        shell: bash
        run: |
          set -euo pipefail
          ZIP="dist/${{ steps.meta.outputs.zip_name }}"

          echo "ZIP listing (first 80 lines):"
          zipinfo -1 "$ZIP" | head -80

          # Ensure these exist at the ZIP root level
          zipinfo -1 "$ZIP" | grep -x "registration.php" >/dev/null
          zipinfo -1 "$ZIP" | grep -x "composer.json" >/dev/null
          zipinfo -1 "$ZIP" | grep -x "etc/module.xml" >/dev/null

      - name: Create GitHub Release + upload ZIP
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/${{ steps.meta.outputs.zip_name }}