<div class="payment-method" data-bind="css: {'_active': (getId() == isChecked())}">
    <div class="payment-method-title field choice">
        <input type="radio"
               name="payment[method]"
               class="radio"
               data-bind="attr: {'id': getId()}, value: getId(), checked: isChecked, click: selectPaymentMethod"/>
        <label class="label" data-bind="attr: {'for': getId()}">
            <span data-bind="text: getTitle()"></span>
            <span class="saved-card-info">
                <!-- ko if: getIcons(getCardType()) -->
                <img data-bind="attr: {src: getIcons(getCardType()).url, width: getIcons(getCardType()).width, height: getIcons(getCardType()).height}" class="card-icon"/>
                <!-- /ko -->
                <span class="card-number" data-bind="text: '•••• ' + getMaskedCard()"></span>
                <span class="card-expiry" data-bind="text: '(' + getExpirationDate() + ')'"></span>
            </span>
        </label>
    </div>
    <div class="payment-method-content">
        <!-- ko foreach: getRegion('messages') -->
        <!-- ko template: getTemplate() --><!-- /ko -->
        <!--/ko-->

        <div class="payment-method-billing-address">
            <!-- ko foreach: $parent.getRegion(getBillingAddressFormName()) -->
            <!-- ko template: getTemplate() --><!-- /ko -->
            <!--/ko-->
        </div>

        <div class="checkout-agreements-block">
            <!-- ko foreach: $parent.getRegion('before-place-order') -->
            <!-- ko template: getTemplate() --><!-- /ko -->
            <!--/ko-->
        </div>

        <div class="actions-toolbar">
            <div class="primary">
                <button class="action primary checkout"
                        type="submit"
                        data-bind="
                        click: placeOrder,
                        attr: {title: $t('Place Order')},
                        css: {disabled: !isPlaceOrderActionAllowed()},
                        enable: (getId() == isChecked())
                        "
                        disabled>
                    <span data-bind="i18n: 'Place Order'"></span>
                </button>
            </div>
        </div>
    </div>
</div>
